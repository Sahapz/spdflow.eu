<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spdflow.eu</title>
    <link rel="icon" type="image/x-icon" href="https://r2.fivemanage.com/3Fzo0eYFWgmcfKqCdpUHG/spdflow_SFPNG.png"">
    <script src=" https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Space+Grotesk:wght@400;500;700&display=swap");

        .sf-heading {
            font-family: "Do Hyeon", sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .sf-body {
            font-family: "Space Grotesk", sans-serif;
        }
    </style>
</head>

<body class="sf-body min-h-screen bg-slate-950 text-slate-100">
    <section class="relative min-h-screen overflow-hidden">
        <div class="absolute inset-0">
            <video class="h-full w-full object-cover" autoplay muted loop>
                <source src="intro2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="absolute inset-0 bg-slate-950/70"></div>
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-950/60 via-slate-900/30 to-sky-950/70"></div>
        </div>

        <div class="pointer-events-none absolute inset-0">
            <div class="absolute -left-12 top-12 h-56 w-56 rounded-full bg-indigo-500/25 blur-3xl"></div>
            <div class="absolute bottom-16 right-8 h-64 w-64 rounded-full bg-cyan-500/20 blur-3xl"></div>
        </div>

        <div class="relative mx-auto flex min-h-screen w-full max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8">
            <div class="grid w-full gap-8 lg:grid-cols-12">
                <div class="lg:col-span-7">
                    <p class="sf-heading text-sm text-indigo-300">SpeedFlow Racing</p>
                    <h1 class="sf-heading mt-3 text-4xl  text-white">
                        The server is currently in closed beta.
                    </h1>
                    <p class="mt-5 max-w-xl text-sm text-slate-200 sm:text-base">
                        Join Discord for updates.
                    </p>
                </div>

                <div class="lg:col-span-5">
                    <div
                        class="rounded-2xl border border-indigo-900/70 bg-slate-900/65 p-6 shadow-2xl shadow-indigo-950/40 backdrop-blur-sm sm:p-7">
                        <div class="flex items-center gap-4">
                            <img class="h-14 w-14 rounded-xl border border-indigo-700/60 bg-slate-950/60 p-2"
                                src="https://r2.fivemanage.com/3Fzo0eYFWgmcfKqCdpUHG/spdflow_SFPNG.png"
                                alt="SpeedFlow logo">
                            <div>
                                <p class="sf-heading text-xs text-indigo-300">Discord</p>
                                <p class="text-lg font-semibold text-white">Join our community!</p>
                            </div>
                        </div>

                        <a href="https://discord.spdflow.eu"
                            class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl border border-cyan-400/50 bg-cyan-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-cyan-400">
                            <i class="fa-brands fa-discord text-lg"></i>
                            <span>Join Discord</span>
                        </a>

                        <p class="mt-5 text-center text-[11px] text-slate-400">
                            Beta access and announcements are handled through Discord.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
